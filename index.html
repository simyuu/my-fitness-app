<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>我的健身基地</title>
  
<link rel="stylesheet" href="style.css">

</head>


<body>

  <div class="app">

    <h1>🏋️ 我的健身基地</h1>

    <div class="subtitle">
      今天也完成一點點。
    </div>

    <div class="card">
  <h2>🎯 今日訓練任務</h2>

  <div id="todayPlan">
    正在產生今日任務……
  </div>
    </div>

    <div class="card">

      <h2>➕ 新增訓練</h2>

      <label>運動名稱</label>

      <input
        id="exercise"
        placeholder="例如：深蹲">

      <div id="lastWorkout">
  輸入運動名稱後，會顯示上次紀錄。
      </div>
      
      <div id="weightAdvice">
  等待運動資料……
      </div>

      <label>重量（kg）</label>

      <input
        id="weight"
        type="number"
        placeholder="例如：10">


      <label>次數</label>

      <input
        id="reps"
        type="number"
        placeholder="例如：12">


      <label>組數</label>

      <input
        id="sets"
        type="number"
        placeholder="例如：3">


      <button id="saveButton">
        ＋ 儲存訓練
      </button>

    </div>


    <div class="card">

      <h2>📋 今日訓練</h2>

      <div id="workoutList">
        還沒有訓練紀錄。
      </div>

    </div>


    <div class="card">

      <h2>📊 今日訓練量</h2>

      <div id="totalVolume">
        0 kg
      </div>
      
<div class="card">
  <h2>📚 訓練歷史</h2>
  <div id="historyList">
    還沒有歷史紀錄。
  </div>
</div>
      <div class="card">
  <h2>🧠 個人分析</h2>

  <div id="analysis">
    累積一些訓練紀錄後，
    我會開始分析你的進步。
  </div>
      </div>
    </div>


    <div class="card">

      <h2>🧹 資料管理</h2>

      <button id="clearButton"
              class="danger">

        清除今天全部紀錄

      </button>

    </div>

  </div>
  
  <script src="app.js"></script>
  
</body>

</html>
