<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>我的健身基地</title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 480px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
    }

    .workout {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .workout-name {
      font-size: 18px;
      font-weight: bold;
    }

    .workout-detail {
      margin-top: 5px;
      color: #777;
      line-height: 1.6;
    }

    .deleteButton {
      margin-top: 10px;
      padding: 8px;
      background: #eee;
      color: #555;
      font-size: 14px;
    }

    .danger {
      background: #555;
    }

    #totalVolume {
      font-size: 32px;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="app">

    <h1>🏋️ 我的健身基地</h1>

    <div class="subtitle">
      今天也完成一點點。
    </div>


    <div class="card">

      <h2>➕ 新增訓練</h2>

      <label>運動名稱</label>

      <input
        id="exercise"
        placeholder="例如：深蹲">


      <label>重量（kg）</label>

      <input
        id="weight"
        type="number"
        placeholder="例如：10">


      <label>次數</label>

      <input
        id="reps"
        type="number"
        placeholder="例如：12">


      <label>組數</label>

      <input
        id="sets"
        type="number"
        placeholder="例如：3">


      <button id="saveButton">
        ＋ 儲存訓練
      </button>

    </div>


    <div class="card">

      <h2>📋 今日訓練</h2>

      <div id="workoutList">
        還沒有訓練紀錄。
      </div>

    </div>


    <div class="card">

      <h2>📊 今日訓練量</h2>

      <div id="totalVolume">
        0 kg
      </div>

    </div>


    <div class="card">

      <h2>🧹 資料管理</h2>

      <button id="clearButton"
              class="danger">

        清除今天全部紀錄

      </button>

    </div>

  </div>


<script>

var workouts =
  JSON.parse(
    localStorage.getItem("myWorkouts")
  ) || [];


var saveButton =
  document.getElementById("saveButton");

var clearButton =
  document.getElementById("clearButton");

var workoutList =
  document.getElementById("workoutList");

var totalVolume =
  document.getElementById("totalVolume");


saveButton.addEventListener(
  "click",
  function() {

    var exercise =
      document
      .getElementById("exercise")
      .value
      .trim();

    var weight =
      Number(
        document
        .getElementById("weight")
        .value
      );

    var reps =
      Number(
        document
        .getElementById("reps")
        .value
      );

    var sets =
      Number(
        document
        .getElementById("sets")
        .value
      );


    if (
      exercise === "" ||
      weight <= 0 ||
      reps <= 0 ||
      sets <= 0
    ) {

      alert("請把資料填完整！");

      return;
    }


    var workout = {

      id: Date.now(),

      date:
        new Date()
        .toISOString()
        .slice(0, 10),

      exercise: exercise,

      weight: weight,

      reps: reps,

      sets: sets

    };


    workouts.push(workout);


    localStorage.setItem(
      "myWorkouts",
      JSON.stringify(workouts)
    );


    document
      .getElementById("exercise")
      .value = "";

    document
      .getElementById("weight")
      .value = "";

    document
      .getElementById("reps")
      .value = "";

    document
      .getElementById("sets")
      .value = "";


    displayWorkouts();

  }
);


function displayWorkouts() {

  var today =
    new Date()
    .toISOString()
    .slice(0, 10);


  var todayWorkouts =
    workouts.filter(
      function(workout) {

        return workout.date === today;

      }
    );


  workoutList.innerHTML = "";


  var total = 0;


  if (todayWorkouts.length === 0) {

    workoutList.innerHTML =
      "還沒有訓練紀錄。";

  }

  else {

    todayWorkouts.forEach(
      function(workout) {

        var volume =
          workout.weight *
          workout.reps *
          workout.sets;


        total =
          total + volume;


        var div =
          document.createElement("div");


        div.className =
          "workout";


        var name =
          document.createElement("div");


        name.className =
          "workout-name";


        name.textContent =
          "🏋️ " +
          workout.exercise;


        var detail =
          document.createElement("div");


        detail.className =
          "workout-detail";


        detail.textContent =
          workout.weight +
          " kg × " +
          workout.reps +
          " 次 × " +
          workout.sets +
          " 組" +
          "｜訓練量：" +
          volume +
          " kg";


        var deleteButton =
          document.createElement("button");


        deleteButton.className =
          "deleteButton";


        deleteButton.textContent =
          "🗑️ 刪除這筆";


        deleteButton.addEventListener(
          "click",
          function() {

            deleteWorkout(workout.id);

          }
        );


        div.appendChild(name);

        div.appendChild(detail);

        div.appendChild(deleteButton);


        workoutList.appendChild(div);

      }
    );

  }


  totalVolume.textContent =
    total + " kg";

}


function deleteWorkout(id) {

  workouts =
    workouts.filter(
      function(workout) {

        return workout.id !== id;

      }
    );


  localStorage.setItem(
    "myWorkouts",
    JSON.stringify(workouts)
  );


  displayWorkouts();

}


clearButton.addEventListener(
  "click",
  function() {

    var today =
      new Date()
      .toISOString()
      .slice(0, 10);


    var hasWorkout =
      workouts.some(
        function(workout) {

          return workout.date === today;

        }
      );


    if (!hasWorkout) {

      alert(
        "今天沒有可以清除的紀錄！"
      );

      return;
    }


    var confirmed =
      confirm(
        "確定要清除今天全部的訓練紀錄嗎？"
      );


    if (!confirmed) {

      return;

    }


    workouts =
      workouts.filter(
        function(workout) {

          return workout.date !== today;

        }
      );


    localStorage.setItem(
      "myWorkouts",
      JSON.stringify(workouts)
    );


    displayWorkouts();

  }
);


displayWorkouts();

</script>

</body>

</html>
